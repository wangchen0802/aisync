<title>AISync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAFAFA; --side:#F5F5F6; --panel:#FFFFFF; --subtle:#F4F4F5; --hover:#EFEFF1;
  --line:#E7E7EA; --line-2:#D8D8DD;
  --ink:#09090B; --ink-2:#3F3F46; --muted:#71717A; --faint:#A1A1AA;
  --accent:#3E63DD; --accent-soft:#EDF2FE; --accent-ink:#3451B2;
  --primary:#09090B; --on-primary:#FFFFFF;
  --green:#18794E; --green-bg:#E9F9EE; --amber:#AD5700; --amber-bg:#FFF4D5;
  --red:#CD2B31; --red-bg:#FFEBEC; --violet:#6E56CF; --violet-bg:#F4F0FE; --gray-bg:#F1F1F3;
  --redact:#FFE7A3;
  --shadow:0 1px 2px rgba(16,16,20,.04),0 1px 1px rgba(16,16,20,.02);
  --shadow-lg:0 12px 40px -8px rgba(16,16,20,.18),0 2px 6px rgba(16,16,20,.06);
  --sans:"Geist","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0A0B; --side:#0E0E10; --panel:#131316; --subtle:#1A1A1E; --hover:#202025;
    --line:#26262B; --line-2:#34343A;
    --ink:#EDEDEF; --ink-2:#C4C4CA; --muted:#8B8B94; --faint:#5E5E66;
    --accent:#7C9BFF; --accent-soft:#1B2340; --accent-ink:#A3B9FF;
    --primary:#EDEDEF; --on-primary:#0A0A0B;
    --green:#4CC38A; --green-bg:#11261B; --amber:#F1A10D; --amber-bg:#2B2111; --red:#FF6369; --red-bg:#301516;
    --violet:#9E8CFC; --violet-bg:#221B3A; --gray-bg:#1E1E22; --redact:#5A4A12;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 48px -8px rgba(0,0,0,.7),0 0 0 1px var(--line);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0A0B; --side:#0E0E10; --panel:#131316; --subtle:#1A1A1E; --hover:#202025;
  --line:#26262B; --line-2:#34343A;
  --ink:#EDEDEF; --ink-2:#C4C4CA; --muted:#8B8B94; --faint:#5E5E66;
  --accent:#7C9BFF; --accent-soft:#1B2340; --accent-ink:#A3B9FF;
  --primary:#EDEDEF; --on-primary:#0A0A0B;
  --green:#4CC38A; --green-bg:#11261B; --amber:#F1A10D; --amber-bg:#2B2111; --red:#FF6369; --red-bg:#301516;
  --violet:#9E8CFC; --violet-bg:#221B3A; --gray-bg:#1E1E22; --redact:#5A4A12;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 48px -8px rgba(0,0,0,.7),0 0 0 1px var(--line);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.ws{display:flex;align-items:center;gap:9px;padding:4px 6px}
.logo{width:24px;height:24px;border-radius:6px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.logo svg{width:14px;height:14px;stroke:var(--on-primary)}
.ws b{font-weight:600;font-size:14px;letter-spacing:-.01em}
.ws small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.search{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--muted);box-shadow:var(--shadow);text-align:left}
.search:hover{border-color:var(--line-2)}
.search span{flex:1}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);background:var(--subtle);border-radius:4px;padding:0 5px;color:var(--muted)}
.navg{display:flex;flex-direction:column;gap:1px}
.navg h6{margin:6px 8px 4px;font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.02em}
.nv{display:flex;align-items:center;gap:9px;border:0;background:none;border-radius:6px;padding:6px 8px;color:var(--ink-2);text-align:left;width:100%}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.nv .sp{flex:1}
.nv .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.nv .n.hot{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px}
.pdot{width:8px;height:8px;border-radius:2.5px;flex:none}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:0 8px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.provrow{display:flex;flex-wrap:wrap;gap:4px;padding:0 8px}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.crumb b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.seg{display:inline-flex;background:var(--subtle);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:3px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--line);font-weight:500}
.seg-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--subtle)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.pri:hover{opacity:.88;background:var(--primary)}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn svg.i{width:14px;height:14px}
.content{padding:24px;max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:64ch}

/* ---------- atoms ---------- */
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;flex:none;box-shadow:0 0 0 2px var(--panel)}
.av.lg{width:28px;height:28px;font-size:12px}
.stack{display:inline-flex}
.stack .av+.av{margin-left:-6px}
.pv{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 6px 1px 2px;white-space:nowrap}
.pv i{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:8.5px;font-weight:700;color:#fff;letter-spacing:-.02em;font-family:var(--sans)}
.pv.only{padding:1px;border:0;background:none}
.pv.only i{width:18px;height:18px;font-size:9.5px;border-radius:5px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:999px;padding:1px 8px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-confirmed,.s-done{color:var(--green);background:var(--green-bg)}
.s-discussing,.s-doing{color:var(--accent-ink);background:var(--accent-soft)}
.s-conflict,.s-blocked{color:var(--red);background:var(--red-bg)}
.s-superseded,.s-todo{color:var(--muted);background:var(--gray-bg)}
.s-pending{color:var(--amber);background:var(--amber-bg)}
.kind{font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;line-height:18px}
.k-decision{color:var(--accent-ink);background:var(--accent-soft)}
.k-task{color:var(--amber);background:var(--amber-bg)}
.k-insight{color:var(--green);background:var(--green-bg)}
.k-question{color:var(--violet);background:var(--violet-bg)}
.proj{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted)}
.prog{height:4px;border-radius:2px;background:var(--subtle);overflow:hidden;flex:1;min-width:40px}
.prog span{display:block;height:100%;border-radius:2px;background:var(--accent)}
.prog.done span{background:var(--green)}
.prog.blocked span{background:var(--red)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.box-h h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.box-h .c{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.link{border:0;background:none;padding:0;color:var(--accent-ink);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.link:hover{text-decoration:underline}
.more{border:0;background:none;padding:0;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.more:hover{color:var(--ink)}
.more svg{width:12px;height:12px;transition:transform .15s}
.more[aria-expanded="true"] svg{transform:rotate(90deg)}
.detail{margin-top:10px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--ink-2)}
.detail h5{margin:0 0 4px;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.detail ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:2px}
.quote{border-left:2px solid var(--line-2);padding:6px 10px;background:var(--subtle);border-radius:0 6px 6px 0;color:var(--muted)}
.quote .who{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:3px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
mark{background:var(--redact);color:inherit;border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:11.5px}

/* ---------- overview ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.st{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.st .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.st .v{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.st .d{font-size:11.5px;color:var(--muted)}
.st .d b{font-weight:500;color:var(--green)}
.st .d b.neg{color:var(--red)}
.spark{width:100%;height:28px;display:block}
.ov{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.attn{display:flex;flex-direction:column}
.at{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start}
.at:first-child{border-top:0}
.at-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.at-ic svg{width:14px;height:14px}
.at-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.at-b p{margin:0}
.at-b .vs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.at-b .vs div{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.row-a{display:flex;gap:6px;flex-wrap:wrap}
.pr{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .nm{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.pr .bars{display:flex;align-items:center;gap:10px}
.pr .pc{font-family:var(--mono);font-size:12px;color:var(--ink-2);width:36px;text-align:right}
.pr .cnt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dist{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.dr{display:grid;grid-template-columns:118px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12px}
.dr .b{height:6px;border-radius:3px;background:var(--subtle);overflow:hidden}
.dr .b span{display:block;height:100%;border-radius:3px}
.dr .x{font-family:var(--mono);text-align:right;color:var(--ink-2)}

/* ---------- consensus list ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 10px;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tabs .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.list{display:flex;flex-direction:column}
.it{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.it:first-child{border-top:0}
.it:hover{background:color-mix(in srgb,var(--subtle) 50%,transparent)}
.it h3{margin:0;font-size:14px;font-weight:500;letter-spacing:-.005em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.it .why{color:var(--ink-2);font-size:12.5px;margin:0;max-width:78ch}
.it .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.it .full{grid-column:1/-1}
.it .foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acks{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.it.superseded h3{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}

/* ---------- kanban ---------- */
.kb-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 4px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;min-width:1000px}
.kc{background:var(--subtle);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.kc.over{border-color:var(--accent);background:var(--accent-soft)}
.kc-h{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:12.5px;font-weight:500}
.kc-h .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:grab}
.tk:hover{border-color:var(--line-2)}
.tk.drag{opacity:.4}
.tk h4{margin:0;font-size:13px;font-weight:500;line-height:1.4}
.tk .pg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.tk .upd{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.tk .upd .pv{flex:none}
.tk .bl{font-size:11.5px;color:var(--red);background:var(--red-bg);border-radius:6px;padding:4px 8px}
.tk .dup{font-size:11.5px;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:4px 8px}
.sub{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.sub li{display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.sub li.ok{color:var(--muted);text-decoration:line-through}
.sub li::before{content:"";width:12px;height:12px;border:1.5px solid var(--line-2);border-radius:4px;flex:none}
.sub li.ok::before{background:var(--green);border-color:var(--green)}

/* ---------- activity ---------- */
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev h3{margin:0 0 2px;font-size:13.5px;font-weight:500}
.ev p{margin:4px 0 0;color:var(--ink-2);font-size:12.5px;max-width:78ch}
.ev .outs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- inbox ---------- */
.ib{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.ss{display:flex;flex-direction:column;overflow:hidden}
.sess{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.sess:first-child{border-top:0}
.sess:hover{background:var(--subtle)}
.sess[aria-current="true"]{background:var(--accent-soft)}
.sess .t{font-weight:500}
.rv{padding:18px;display:flex;flex-direction:column;gap:14px}
.rv h2{margin:0;font-size:17px;letter-spacing:-.015em}
.rv .sum{margin:0;color:var(--ink-2);max-width:72ch}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.ex:has(input:checked){border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.ex input{margin-top:3px;accent-color:var(--accent)}
.ex label{display:flex;flex-direction:column;gap:4px;cursor:pointer;flex:1}
.ex .s{font-size:12px;color:var(--muted)}
.ex .warn{color:var(--amber)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.acts .sp{flex:1}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 8px;font-size:12.5px}
.rule{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

/* ---------- ask ---------- */
.ask{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px}
.ask:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ask input{flex:1;border:0;background:none;font-size:15px;min-width:0;padding:6px 0}
.ask input:focus{outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.chip:hover{border-color:var(--line-2)}
.ans{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ans p{margin:0;max-width:74ch;font-size:14px;line-height:1.65}
.ci{font-family:var(--mono);font-size:10.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-left:2px;vertical-align:1px}
.srcs{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.srcs div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.ig{padding:14px;display:flex;flex-direction:column;gap:10px}

.ig-h .sp{flex:1}
.sw{width:32px;height:18px;border-radius:999px;border:0;background:var(--line-2);position:relative;padding:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
.ig .m{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.ig .f{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.ig .f b{font-family:var(--mono);color:var(--ink-2);font-weight:500}
.sec-t{margin:4px 0 -6px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-t span{font-weight:400;color:var(--muted);font-size:12px}

/* ---------- digest ---------- */
.dg{padding:22px 24px;display:flex;flex-direction:column;gap:18px;max-width:820px}
.dg h2{margin:0;font-size:20px;letter-spacing:-.02em}
.dg .k{display:flex;gap:28px;flex-wrap:wrap}
.dg .k div b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dg .k div span{font-size:12px;color:var(--muted)}

.dgs h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
.dgs ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}

.scrim{position:fixed;inset:0;background:rgba(10,10,12,.32);backdrop-filter:blur(2px);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal{width:100%;max-width:600px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--line)}
.pal-i{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}

.pal-l{max-height:360px;overflow-y:auto;padding:6px}

.po small{color:var(--muted);font-size:11.5px}
.pal-f{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:9px 14px;border-radius:9px;font-size:13px;z-index:30;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}

const ic = (k,st="") => `<svg class="i" viewBox="0 0 16 16" ${st?`style="${st}"`:""}>${I[k]}</svg>`;
const pv = (k,only) => {const p=PROV[k];return `<span class="pv${only?" only":""}" title="${p.n}"><i style="background:${p.c}">${p.a}</i>${only?"":p.n}</span>`};
const av = (k,lg) => {const m=M[k];return `<span class="av${lg?" lg":""}" style="background:${m.c}" title="${m.n} · ${m.r}">${m.n.slice(0,1)}</span>`};
const stack = ks => `<span class="stack">${ks.map(k=>av(k)).join("")}</span>`;
const proj = k => k?`<span class="proj"><span class="pdot" style="background:${P[k].c}"></span>${P[k].n}</span>`:"";
const showWhy = id => detail!=="lite" || open.has(id);
const showFull = id => detail==="full" || open.has(id);
const moreBtn = (id,label="细节") => `<button class="more" data-open="${id}" aria-expanded="${showFull(id)}">${ic("chev")}${showFull(id)?"收起":label}</button>`;
function toast(t){const e=$("#toast");e.innerHTML=ic("check")+t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2400)}
function projPct(k){const ts=tasks.filter(t=>t.p===k);let d=0,a=0;ts.forEach(t=>{a+=t.sub.length;d+=t.sub.filter(s=>s[1]).length});return a?Math.round(d/a*100):0}
function spark(vals,color){const w=120,h=28,mx=Math.max(...vals),mn=Math.min(...vals);const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-3-(v-mn)/((mx-mn)||1)*(h-8)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${color}"/></svg>`}

  if(!inbox.find(s=>s.id===selSess)) selSess=inbox[0].id;
  const s = inbox.find(x=>x.id===selSess);
  return `<div class="ph"><div><h1>收件箱</h1><p>AI 已经替你提炼好了，勾选想发布的条目即可。没发布的内容只有你自己能看到。</p></div></div>
  <div class="ib">
    <section class="box ss">${inbox.map(x=>`<button class="sess" data-sess="${x.id}" aria-current="${x.id===selSess}"><span class="t">${x.t}</span><span class="meta">${pv(x.src)}<span>${x.time}</span></span></button>`).join("")}</section>
    <section class="box rv">
      <div class="meta">${pv(s.src)}<span>${s.time}</span></div>
      <h2>${s.t}</h2>
      <p class="sum">${s.sum}</p>
      <div style="display:flex;flex-direction:column;gap:6px">${s.items.map((it,i)=>`<div class="ex"><input type="checkbox" id="ex-${s.id}-${i}" data-item="${i}" ${it.on?"checked":""}>
        <label for="ex-${s.id}-${i}"><span><span class="kind k-${it.k}">${KIND[it.k]}</span></span><span>${it.t}</span>${it.s?`<span class="s ${it.warn?"warn":""}">${it.warn?"⚠ ":""}${it.s}</span>`:""}</label></div>`).join("")}</div>
      <div class="acts">
        <label class="rule" for="projSel">归入项目</label>
        <select class="sel" id="projSel">${Object.entries(P).map(([k,p])=>`<option value="${k}" ${s.p===k?"selected":""}>${p.n}</option>`).join("")}<option value="" ${!s.p?"selected":""}>不归入项目</option></select>
        <span class="sp"></span>
        <button class="btn ghost" data-ib="discard">丢弃</button>
        <button class="btn" data-ib="private">仅自己可见</button>
        <button class="btn pri" data-ib="publish">发布到团队</button>
      </div>
      <label class="rule"><input type="checkbox" id="autoRule" style="accent-color:var(--accent)"> 以后 ${PROV[s.src].n} 里属于「${s.p?P[s.p].n:"未分类"}」的会话自动发布（敏感内容仍会拦下）</label>
    </section>
  </div>`;
}

function vInt(){
  const ai = Object.keys(PROV);
  const card = (k,p,on,desc,count,how) => `<div class="box ig"><div class="ig-h">${`<span class="pv only"><i style="background:${p.c}">${p.a}</i></span>`}<div><b>${p.n}</b><small>${desc}</small></div><span class="sp"></span>
      <button class="sw" role="switch" aria-checked="${on}" aria-label="${p.n}" data-sw="${k}"></button></div>
    ${how?`<div class="m"><span class="pill">${how}</span>${on?`<span class="pill" style="color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,var(--line))">捕获中</span>`:""}</div>`:""}
    ${count!==null?`<div class="f"><span>本周会话</span><b>${on?count:"—"}</b></div>`:""}</div>`;
  return `<div class="ph"><div><h1>AI 接入</h1><p>不需要换工具：大家继续用自己习惯的 AI，AISync 在旁边自动捕获和提炼。默认只捕获，发布前由本人确认。</p></div>
    <button class="btn" data-toast="已复制插件安装链接">${ic("copy")}邀请成员安装插件</button></div>
  <div class="sec-t">对话来源 <span>${ai.filter(k=>conn[k]).length}/${ai.length} 已接入</span></div>
  <div class="grid">${ai.map(k=>card(k,PROV[k],conn[k],PROV[k].how==="浏览器插件"?"网页版 · 桌面版":PROV[k].how==="导出导入"?"IDE 会话":"IDE / CLI",sessCount[k],PROV[k].how)).join("")}</div>
  <div class="sec-t">同步到 <span>共识、任务和简报会推送到这些工具</span></div>
  <div class="grid">${OUT.map(o=>card("o-"+o.k,{n:o.n,c:o.c,a:o.a},o.on,o.d,null,"")).join("")}</div>
  <section class="box"><div class="box-h"><h2>隐私与脱敏</h2><span class="c">工作区级别</span></div>
    <div class="list">${[["原始对话仅作者本人可见，管理员也无法查看",true],["自动打码 API Key、密码、手机号、邮箱",true],["财务数据、客户名单默认不发布",true],["允许使用自带的 LLM Key 做提炼（数据不出你的账号）",false]].map((r,i)=>`<div class="it" style="grid-template-columns:minmax(0,1fr) auto;align-items:center"><span>${r[0]}</span><button class="sw" role="switch" aria-checked="${r[1]}" aria-label="${r[0]}" data-sw="priv${i}"></button></div>`).join("")}</div></section>`;
}

const VIEWS = {home:vHome,cons:vCons,tasks:vTasks,act:vAct,inbox:vInbox,ask:vAsk,digest:vDigest,int:vInt};
function render(){renderChrome(); $("#view").innerHTML = VIEWS[view]();}
function go(v,{keepProj}={}){view=v; if(!keepProj) projF=null; render(); window.scrollTo({top:0});}

/* ============ interactions ============ */
document.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(b.id==="openPal") return openPal();
  if(b.id==="newBtn") return go("inbox");
  if(d.view) return go(d.view);
  if(d.proj){projF=d.proj; view = view==="tasks"?"tasks":"cons"; render(); return;}
  if("clearproj" in d){projF=null; render(); return;}
  if(d.detail){detail=d.detail; store.set("aisync.detail",detail); open.clear(); render(); return;}
  if(d.open){open.has(d.open)?open.delete(d.open):open.add(d.open); render(); return;}
  if(d.decf){decF=d.decf; render(); return;}
  if(d.goto){decF="all"; go("cons"); setTimeout(()=>{const el=document.getElementById(d.goto); el&&el.scrollIntoView({block:"center"}); el&&el.classList.add("flash")},30); return;}
  if(d.resolve){decF="conflict"; go("cons"); return;}
  if(d.ack){const x=decisions.find(y=>y.id===d.ack); if(!x.acks.includes("me")) x.acks.push("me");
    if(x.acks.length>=3){x.s="confirmed"; delete x.need; const t=tasks.find(t=>t.block&&t.block.includes(x.id)); if(t){t.s="doing"; t.block=null; t.upd="首屏方向已确定，继续做视觉稿"; t.ago="刚刚";}}
    render(); toast(x.s==="confirmed"?`${x.id} 已达成共识，相关阻塞已解除`:"已记录你的确认"); return;}
  if(d.object){toast("已通知 "+M[decisions.find(y=>y.id===d.object).o].n+"，并在决策下开了讨论线程"); return;}
  if(d.pick){const x=decisions.find(y=>y.id===d.pick); x.s="confirmed";
    if(d.side==="b"){x.t="定价：按席位 $15/人/月 + AI 用量附加包"; x.why="参考竞品均价 $14，定在 $15 以保证毛利；用量包覆盖重度用户。"}
    x.acks=[...new Set([...x.acks,"lin","me"])]; alerts=alerts.filter(a=>a!=="conflict"); render(); toast(`冲突已解决，${x.id} 已同步给全队和所有接入的 AI`); return;}
  if(d.alertx){alerts=alerts.filter(a=>a!==d.alertx); render(); toast(d.msg); return;}
  if(d.cite){const x=decisions.find(y=>y.id===d.cite); copy(`[团队共识 ${x.id}] ${x.t}。理由：${x.why}`,"已复制，可以粘贴到任意 AI 对话"); return;}
  if("citeAll" in d){copy(decisions.filter(x=>x.s==="confirmed").map(x=>`- ${x.t}（${x.id}）`).join("\n"),"已复制全部已确认共识"); return;}
  if(d.sess){selSess=d.sess; render(); return;}
  if(d.ib){
    const i=inbox.findIndex(x=>x.id===selSess), s=inbox[i], p=$("#projSel").value;
    if(d.ib==="publish"){
      const picked=[...document.querySelectorAll("[data-item]")].filter(x=>x.checked).map(x=>s.items[+x.dataset.item]);
      if(!picked.length) return toast("先勾选至少一条要发布的内容");
      let nd=0,nt=0;
      picked.forEach(it=>{const t=it.t.replace(/<mark>.*?<\/mark>/g,"[已打码]");
        if(it.k==="decision"){nd++; decisions.unshift({id:"D-"+(25+nd),t,p,s:"discussing",o:"me",src:s.src,time:"刚刚",acks:["me"],why:it.s||s.sum,alt:[],q:s.sum});}
        else if(it.k==="task"){nt++; tasks.unshift({id:"T-"+(42+nt),t:t.replace(/^.+?：/,""),p,o:"me",s:"todo",src:s.src,due:"本周",sub:[["待拆分",0]],upd:"由收件箱发布",ago:"刚刚"});}
        activity.unshift({who:"me",src:s.src,time:"刚刚",t:s.t,sum:s.sum,outs:[[it.k,t.slice(0,18)+(t.length>18?"…":"")]],det:["来自收件箱发布"]});});
      toast(`已发布 ${picked.length} 条${nd?`，其中 ${nd} 条决策等待队友确认`:""}`);
    } else toast(d.ib==="private"?"已保存，只有你自己可见":"已丢弃");
    inbox.splice(i,1); render(); return;
  }
  if(d.sw){const k=d.sw; if(k in conn){conn[k]=!conn[k]; render(); toast(conn[k]?`${PROV[k].n} 已接入，开始捕获`:`已暂停捕获 ${PROV[k].n}`);} else {const o=OUT.find(o=>"o-"+o.k===k); if(o){o.on=!o.on; render(); toast(o.on?`已连接 ${o.n}`:`已断开 ${o.n}`);} else {b.setAttribute("aria-checked", b.getAttribute("aria-checked")!=="true");}} return;}
  if(d.sug){$("#askIn").value=d.sug; toast("原型里只演示一个示例回答"); return;}
  if(d.copy){copy($("#"+d.copy).textContent,"已复制"); return;}
  if(d.toast){toast(d.toast); return;}
});
function copy(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg),()=>toast("复制失败，请手动选中复制"))}catch(err){toast("复制失败，请手动选中复制")}}
document.addEventListener("submit",e=>{e.preventDefault(); toast("原型里只演示一个示例回答");});

/* drag & drop for kanban */
let dragId=null;
document.addEventListener("dragstart",e=>{const t=e.target.closest?.("[data-task]"); if(!t) return; dragId=t.dataset.task; t.classList.add("drag"); try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
document.addEventListener("dragend",e=>{document.querySelectorAll(".drag,.over").forEach(x=>x.classList.remove("drag","over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest?.("[data-col]"); if(!c||!dragId) return; e.preventDefault(); document.querySelectorAll(".over").forEach(x=>x!==c&&x.classList.remove("over")); c.classList.add("over");});
document.addEventListener("drop",e=>{const c=e.target.closest?.("[data-col]"); if(!c||!dragId) return; e.preventDefault();
  const t=tasks.find(x=>x.id===dragId); const s=c.dataset.col; dragId=null;
  if(t && t.s!==s){t.s=s; if(s==="done") t.sub.forEach(x=>x[1]=1); if(s!=="blocked") t.block=null; t.upd="手动移动到「"+TS[s]+"」"; t.ago="刚刚"; render(); toast(`${t.id} → ${TS[s]}`);}});

/* command palette */
let palItems=[], palSel=0;
function openPal(){$("#pal").hidden=false; $("#palIn").value=""; buildPal(""); setTimeout(()=>$("#palIn").focus(),0);}
function closePal(){$("#pal").hidden=true;}
function buildPal(q){
  q=q.trim().toLowerCase();
  const m = s => !q || s.toLowerCase().includes(q);
  const nav = NAV.filter(n=>m(n[1])).map(n=>({g:"跳转",h:`${ic(n[2])}<span class="sp">${n[1]}</span>`,run:()=>go(n[0])}));
  const ds = decisions.filter(d=>m(d.t+d.id+M[d.o].n)).slice(0,5).map(d=>({g:"共识",h:`${ic("cons")}<span class="sp">${d.t}</span><span class="tag s-${d.s}">${DS[d.s]}</span>`,run:()=>{decF="all";go("cons");open.add(d.id);render();setTimeout(()=>{const el=document.getElementById(d.id);el&&(el.scrollIntoView({block:"center"}),el.classList.add("flash"))},30)}}));
  const ts = tasks.filter(t=>m(t.t+t.id+M[t.o].n)).slice(0,5).map(t=>({g:"任务",h:`${ic("task")}<span class="sp">${t.t}</span><small>${M[t.o].n} · ${TS[t.s]}</small>`,run:()=>{go("tasks");open.add(t.id);render();setTimeout(()=>{const el=document.getElementById(t.id);el&&(el.scrollIntoView({block:"center",inline:"center"}),el.classList.add("flash"))},30)}}));
  const ask = q?[{g:"问团队记忆",h:`${ic("ask")}<span class="sp">问：“${q}”</span>`,run:()=>{go("ask");$("#askIn").value=q}}]:[];
  palItems=[...ask,...ds,...ts,...nav]; palSel=0;
  let g=""; $("#palList").innerHTML = palItems.map((it,i)=>{const hd=it.g!==g?`<div class="pal-g">${g=it.g}</div>`:"";return hd+`<button class="po" data-pi="${i}" aria-selected="${i===palSel}">${it.h}</button>`}).join("") || `<div class="empty">没有找到结果</div>`;
}
function palMark(){document.querySelectorAll(".po").forEach(b=>b.setAttribute("aria-selected",+b.dataset.pi===palSel)); document.querySelector(`.po[data-pi="${palSel}"]`)?.scrollIntoView({block:"nearest"});}
$("#palIn").addEventListener("input",e=>buildPal(e.target.value));
$("#pal").addEventListener("click",e=>{const o=e.target.closest(".po"); if(o){e.stopPropagation(); closePal(); palItems[+o.dataset.pi].run(); return;} if(e.target.id==="pal") closePal();},true);
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault(); $("#pal").hidden?openPal():closePal(); return;}
  if($("#pal").hidden) return;
  if(e.key==="Escape") closePal();
  else if(e.key==="ArrowDown"){e.preventDefault(); palSel=Math.min(palSel+1,palItems.length-1); palMark();}
  else if(e.key==="ArrowUp"){e.preventDefault(); palSel=Math.max(palSel-1,0); palMark();}
  else if(e.key==="Enter"&&palItems[palSel]){e.preventDefault(); closePal(); palItems[palSel].run();}
});

render();
</script>
